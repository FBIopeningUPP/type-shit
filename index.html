<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>type-shit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Dela+Gothic+One&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="stage">
    <section id="screen-tune" class="screen active">
      <header class="tune-head">
        <div>
          <h1 class="wordmark"><span data-game-name>type-shit</span><i class="cursor"></i></h1>
          <p class="tagline">A pirate radio rhythm game. Tune in to anything.</p>
        </div>
        <div class="sticker-off">Off Air</div>
      </header>
      <div id="dial" class="dial"></div>
      <div class="tune-body">
        <div class="cards">
          <button class="card selected" data-freq="93.7">
            <span class="freq">93.7</span>
            <span class="info"><b>Upload a song</b><small>Drop an mp3, wav or ogg and we build the map.</small></span>
            <span class="tag">Tuned in</span>
          </button>
          <button class="card" data-freq="99.1">
            <span class="freq">99.1</span>
            <span class="info"><b>Capture a tab</b><small>Play along with whatever is on another browser tab.</small></span>
            <span class="tag">Tuned in</span>
          </button>
          <button class="card" data-freq="105.5">
            <span class="freq">105.5</span>
            <span class="info"><b>Demo Track</b><small>No file handy? lets go with built in shit.</small></span>
            <span class="tag">Tuned In</span>
          </button>
        </div>
        <aside class="setup">
          <h2>Broadcast setup</h2>
          <label class="slider">
            <span class="row"><b>Sensitivity</b><output>62%</output></span>
            <input type="range" min="0" max="100" value="62" data-unit="%" />
          </label>
          <label class="slider">
            <span class="row"><b>Minimum Gap</b><output>120 ms</output></span>
            <input type="range" min="40" max="400" value="120" data-unit=" ms" />
          </label>
          <div class="lanes-row">
            <b>Lanes</b>
            <span class="mini-key">D</span><span class="mini-key">F</span>
            <span class="mini-key">J</span><span class="mini-key">K</span>
          </div>
          <button id="btn-start" class="btn-start">Start Broadcast</button>
        </aside>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <div class="game-grid">
        <div class="col-left">
          <div class="station">
            <i class="tape"></i>
            <span class="fm">FM</span>
            <span class="big-freq">93.7</span>
            <span class="station-sub">Night Shift Pirate Signal</span>
          </div>
          <div class="now">
            <span class="label">Now playing</span>
            <div class="song">Night Shift</div>
            <div class="meta">Upload 128 BPM</div>
            <div class="meta">Sensitivity 62%</div>
          </div>
          <div class="spectrum">
            <i style="--h:40%"></i><i style="--h:70%"></i><i class="y" style="--h:90%"></i>
            <i style="--h:55%"></i><i style="--h:30%"></i><i style="--h:80%"></i>
            <i style="--h:60%"></i><i class="y" style="--h:95%"></i><i style="--h:45%"></i>
            <i style="--h:65%"></i><i style="--h:35%"></i><i style="--h:75%"></i>
            <i style="--h:50%"></i><i style="--h:25%"></i>
          </div>
          <div class="score-block">
            <span class="label">Score</span>
            <div class="score">318,450</div>
            <div class="meta">Accuray 94.2% Best Streak 187</div>
          </div>
        </div>
        <div class="col-center"><p class="label">Center Column</p></div>
        <div class="col-right"><p class="label">Right column</p></div>
      </div>
    </section>
    <section id="screen-results" class="screen">
      <h1>Results</h1>
    </section>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
