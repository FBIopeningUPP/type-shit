<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>type-shit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Dela+Gothic+One&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage">
      <section id="screen-tune" class="screen active">
        <header class="tune-head">
          <div>
            <h1 class="wordmark"><span data-game-name>type-shit</span><i class="cursor"></i></h1>
            <p class="tagline">A pirate radio rhythm game. Tune in to anything.</p>
          </div>
          <div class="sticker-off">Off Air</div>
        </header>
        <div id="dial" class="dial"></div>
        <div class="tune-body">
          <div class="cards">
            <button class="card selected" data-freq="93.7">
              <span class="freq">93.7</span>
              <span class="info"><b>Upload a song</b><small>Drop an mp3, wav or ogg and we build the map.</small></span>
              <span class="tag">Tuned in</span>
            </button>
            <button class="card" data-freq="99.1">
              <span class="freq">99.1</span>
              <span class="info"><b>Capture a tab</b><small>Play along with whatever is on another browser tab.</small></span>
              <span class="tag">Tuned in</span>
            </button>
            <button class="card" data-freq="105.5">
              <span class="freq">105.5</span>
              <span class="info"><b>Demo Track</b><small>No file handy? lets go with built in shit.</small></span>
              <span class="tag">Tuned In</span>
            </button>
          </div>
        </div>
      </section>
      <section id="screen-game" class="screen">
        <h1>Gameplay</h1>
      </section>
      <section id="screen-results" class="screen">
        <h1>Results</h1>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
